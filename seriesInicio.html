<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qual é a série?</title>
    <link rel="stylesheet" href="Generos.css">
</head>

<body>
    <center>
        <div id="menssagemInicio">
            <h1>
                Bem-Vindo ao GTG!
            </h1>
            <h3>
                Aqui você pode gozar até falar chega!!
            </h3><br>
            <input onclick="revealHint()" type="button" value="VAMOS COMEÇAR!!">
        </div>
    </center>

    <div id="temas" style="display: none;">
        <br>
        <div class="topo">
            <img src="setaEsquerda.png" class="seta" id="voltar">
            <h1>Qual é a Série?</h1>
        </div>
        <h1 id="tentativas">Tentativas restantes: 13/13</h1>
        <div class="input-container">
            <div style="position: relative; width: 100%;">
                <input type="text" id="guessInput" placeholder="Digite o título da obra" autocomplete="off" /><button
                    id="enviarButton" class="enviarButton">Enviar</button>
                <ul id="suggestions" class="suggestions"></ul>
            </div>
            <div class="botoes">
                <button id="newGameButton" class="newGameButton">Novo jogo</button>
                <button id="giveUpButton" class="giveUpButton">Desistir</button>
            </div>
        </div>

        <div id="hints">
            <h2>Resposta:</h2>
            <div class="hint" id="hint1">- Diretor: ???</div>
            <div class="hint" id="hint2">- Genero: ???</div>
            <div class="hint" id="hint3">- Protagonista: ???</div>
            <div class="hint" id="hint4">- Sinopse: ???</div>
        </div>


        <div id="feedback" class="feedback"></div>

        <ul>
            <img src="logoDPNA.png" width="10%" alt="logo">
            <p class="copyright">&copy; Copyright DPNA CRIAS</p><br>
        </ul>
    </div>
</body>

<script>
    const temas = document.getElementById("temas");
    const menssagemInicio = document.getElementById("menssagemInicio");

    function iniciar() {
        menssagemInicio.style.display = "none";
        temas.style.display = "block";
    }

    document.querySelector("input[type=button]").addEventListener("click", iniciar);
</script>

<script src="series.js"></script>

</html>
