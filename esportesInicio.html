<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qual é o Esporte?</title>
    <link rel="icon" href="logo2.png" type="image/x-icon">
    <link rel="stylesheet" href="Generos.css">
</head>

<body>
        <div class="topo">
            <img src="setaEsquerda.png" class="seta" id="voltar">
            <h1>Qual é o Esporte?</h1>
        </div>
        <h1 id="tentativas">Tentativas restantes: 9/9</h1>
        <div class="input-container">
            <div style="position: relative; width: 100%;">
                <input type="text" id="guessInput" placeholder="Digite o título da obra" autocomplete="off" /><button
                    id="enviarButton" class="enviarButton">Enviar</button>
                <ul id="suggestions" class="suggestions"></ul>
            </div>
            <div class="botoes">
                <button id="newGameButton" class="newGameButton">Novo jogo</button>
                <button id="giveUpButton" class="giveUpButton">Desistir</button>
            </div>
        </div>

        <div id="hints">
            <h2>Resposta:</h2>
            <div class="hint" id="hint1">-Ambiente Práticado : ???</div>
            <div class="hint" id="hint2">-Ano de criação : ???</div>
            <div class="hint" id="hint3">-Maior Jogador : ???</div>
            <div class="hint" id="hint4">-Objetivo : ???</div>
        </div>

        <ul>
            <img src="logoDPNA.png" width="10%" alt="logo">
            <p class="copyright">&copy; Copyright DPNA CRIAS</p><br>
        </ul>
</body>

<script src="Esportes.js"></script>

</html>
